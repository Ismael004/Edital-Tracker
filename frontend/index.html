<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edital Tracker | Dashboard Conectado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased h-screen flex flex-col">

    <!-- Cabeçalho Simples -->
    <header class="bg-white border-b border-slate-200 h-16 flex items-center px-6 shrink-0 shadow-sm">
        <i class="ph-fill ph-robot text-brand-600 text-2xl mr-3"></i>
        <span class="font-bold text-lg tracking-tight text-slate-800">Edital Tracker UI</span>
    </header>

    <!-- Área Principal de Conteúdo -->
    <main class="flex-1 overflow-y-auto p-6 flex flex-col items-center">
        <div class="w-full max-w-4xl space-y-6">
            
            <!-- Título e Botão de Ação -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                <div>
                    <h1 class="text-2xl font-bold text-slate-900">Visão Geral</h1>
                    <p class="text-sm text-slate-500 mt-1">Configure o Agente de IA e realize buscas manuais (On-Demand).</p>
                </div>
                
                <!-- BOTÃO QUE DISPARA A REQUISIÇÃO (Conectado via ID) -->
                <button id="btnForcarBusca" class="bg-brand-600 hover:bg-brand-700 text-white px-5 py-2.5 rounded-lg text-sm font-semibold shadow-sm transition-all flex items-center justify-center gap-2 min-w-[200px]">
                    <i class="ph-bold ph-play" id="iconeBotaoBusca"></i> 
                    <span id="textoBotaoBusca">Forçar Varredura Agora</span>
                </button>
            </div>

            <!-- Formulário de Configuração do Usuário -->
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                <div class="px-6 py-4 border-b border-slate-200 bg-slate-50/50">
                    <h2 class="text-lg font-semibold text-slate-800 flex items-center gap-2">
                        <i class="ph-bold ph-sliders-horizontal text-brand-600"></i> Parâmetros da Busca
                    </h2>
                </div>
                
                <div class="p-6">
                    <form class="space-y-6" onsubmit="event.preventDefault();">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <!-- Prompt de Perfil -->
                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-2">
                                    <i class="ph ph-brain mr-1"></i> Perfil do Avaliador (Gemini)
                                </label>
                                <textarea 
                                    id="promptPerfil" 
                                    rows="5" 
                                    class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm resize-none shadow-inner"
                                >Engenharia Elétrica, focado em tecnologia, programação, estágios, bolsas de pesquisa, inovação e transferência.</textarea>
                            </div>
                            
                            <!-- Lista de Sites (Um por linha) -->
                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-2">
                                    <i class="ph ph-globe mr-1"></i> Sites Monitorados (Groq)
                                </label>
                                <textarea 
                                    id="listaSites" 
                                    rows="5" 
                                    class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-sm font-mono resize-none shadow-inner bg-slate-50"
                                    placeholder="Um link por linha..."
                                >https://sobral.ufc.br/
https://prae.ufc.br/pt/</textarea>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Tabela de Resultados Dinâmica -->
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50/50">
                    <h2 class="text-lg font-semibold text-slate-800 flex items-center gap-2">
                        <i class="ph-bold ph-list-magnifying-glass text-brand-600"></i> Resultados Aprovados
                    </h2>
                    <!-- Badge de Status -->
                    <span id="statusTabela" class="px-2.5 py-1 bg-slate-200 text-slate-700 text-xs font-bold rounded-full">
                        Aguardando Ação
                    </span>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-100/50 text-slate-500 text-xs uppercase tracking-wider border-b border-slate-200">
                                <th class="px-6 py-3 font-semibold">Oportunidade</th>
                                <th class="px-6 py-3 font-semibold w-48">Fonte</th>
                                <th class="px-6 py-3 font-semibold text-center w-32">Status</th>
                                <th class="px-6 py-3 font-semibold text-right w-32">Ação</th>
                            </tr>
                        </thead>
                        <tbody id="corpoTabela" class="text-sm divide-y divide-slate-100">
                            <!-- O conteúdo aqui será injetado pelo JavaScript -->
                            <tr>
                                <td colspan="4" class="px-6 py-12 text-center text-slate-500">
                                    <div class="flex flex-col items-center justify-center">
                                        <i class="ph-duotone ph-magnifying-glass text-4xl text-slate-300 mb-2"></i>
                                        <p class="font-medium text-slate-600">Nenhuma busca realizada ainda.</p>
                                        <p class="text-xs mt-1">Clique em "Forçar Varredura Agora" para iniciar o fluxo de IAs.</p>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <!-- ======== LÓGICA JAVASCRIPT ======== -->
    <script>
        // 1. Endereço base do seu Codespace (Sem a rota específica ainda)
        const API_BASE_URL = "https://cuddly-halibut-qwxgx4pq75rfj96-8000.app.github.dev";
        
        // 2. Mapeia os elementos HTML que vamos interagir
        const btnForcarBusca = document.getElementById('btnForcarBusca');
        const corpoTabela = document.getElementById('corpoTabela');
        const statusTabela = document.getElementById('statusTabela');
        const iconeBotaoBusca = document.getElementById('iconeBotaoBusca');
        const textoBotaoBusca = document.getElementById('textoBotaoBusca');

        // 3. Adiciona o evento de clique no botão
        btnForcarBusca.addEventListener('click', async () => {
            
            // --- A. Preparação dos Dados ---
            const promptValue = document.getElementById('promptPerfil').value;
            const sitesValue = document.getElementById('listaSites').value;
            
            const arraySites = sitesValue.split('\n').map(site => site.trim()).filter(site => site !== '');

            // CHAVES ATUALIZADAS para bater exatamente com o Pydantic / api/rotas.py
            const payload = {
                user_id: "teste_engenharia_01", 
                email: "ismaelsilvaalmeida257@gmail.com",
                target_sites: arraySites,
                prompt_perfil: promptValue
            };

            // --- B. Atualização Visual (Estado de Loading) ---
            btnForcarBusca.disabled = true;
            btnForcarBusca.classList.add('opacity-75', 'cursor-not-allowed');
            textoBotaoBusca.innerText = "Processando LLMs...";
            iconeBotaoBusca.className = "ph-bold ph-spinner animate-spin";
            
            statusTabela.className = "px-2.5 py-1 bg-blue-100 text-blue-700 text-xs font-bold rounded-full animate-pulse";
            statusTabela.innerText = "IAs Trabalhando...";
            
            corpoTabela.innerHTML = `
                <tr>
                    <td colspan="4" class="px-6 py-12 text-center text-brand-600">
                        <div class="flex flex-col items-center justify-center gap-3">
                            <i class="ph-bold ph-spinner animate-spin text-4xl"></i>
                            <div>
                                <p class="font-semibold text-slate-700">Extraindo dados e analisando perfil...</p>
                                <p class="text-xs text-slate-500 mt-1">O Groq está lendo o HTML e o Gemini está julgando a relevância. Isso leva alguns segundos.</p>
                            </div>
                        </div>
                    </td>
                </tr>
            `;

            // --- C. Comunicação Real com o FastAPI ---
            try {
                // ROTA ATUALIZADA de acordo com api/rotas.py
                const resposta = await fetch(`${API_BASE_URL}/api/editais/varredura-ao-vivo`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json' 
                    },
                    body: JSON.stringify(payload)
                });

                if (!resposta.ok) {
                    throw new Error(`Erro HTTP: ${resposta.status}`);
                }

                const dados = await resposta.json();
                console.log("Resposta da API:", dados);

                // --- D. Atualiza a Tabela com os Resultados Reais ---
                // VARIÁVEIS ATUALIZADAS de acordo com o retorno da api/rotas.py
                if (dados.status === "alerta" || !dados.resultados_aprovados || dados.resultados_aprovados.length === 0) {
                    exibirMensagemVazia(dados.mensagem || "Nenhuma oportunidade aprovada pela IA desta vez.");
                } else {
                    renderizarTabela(dados.resultados_aprovados);
                    statusTabela.className = "px-2.5 py-1 bg-green-100 text-green-700 text-xs font-bold rounded-full";
                    // Lendo as estatísticas do novo formato
                    statusTabela.innerText = `${dados.estatisticas.total_aprovados_pela_ia} Aprovados`;
                }

            } catch (erro) {
                console.error("Falha ao comunicar com o servidor:", erro);
                exibirErroServidor();
            } finally {
                btnForcarBusca.disabled = false;
                btnForcarBusca.classList.remove('opacity-75', 'cursor-not-allowed');
                textoBotaoBusca.innerText = "Forçar Varredura Agora";
                iconeBotaoBusca.className = "ph-bold ph-play";
            }
        });

        // ==========================================
        // FUNÇÕES AUXILIARES DE RENDERIZAÇÃO
        // ==========================================

        function renderizarTabela(editais) {
            corpoTabela.innerHTML = ''; 
            
            editais.forEach(edital => {
                const titulo = edital.titulo || edital.título || 'Oportunidade Sem Título Identificado';
                const justificativa = edital.justificativa || 'Selecionado com base no cruzamento semântico do seu perfil.';
                const link = edital.link || '#';
                const fonte = edital.fonte || 'Origem Desconhecida';

                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition-colors group";
                
                tr.innerHTML = `
                    <td class="px-6 py-4">
                        <div class="flex items-start gap-3">
                            <div class="mt-1 hidden sm:block">
                                <i class="ph-duotone ph-file-text text-brand-500 text-xl"></i>
                            </div>
                            <div>
                                <p class="font-medium text-slate-800 text-sm sm:text-base leading-tight">${titulo}</p>
                                <div class="mt-1.5 p-2 bg-slate-100 rounded text-xs text-slate-600 border-l-2 border-brand-500" title="${justificativa}">
                                    <span class="font-semibold text-slate-700"><i class="ph-fill ph-magic-wand mr-1 text-brand-500"></i>IA:</span> ${justificativa}
                                </div>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4 align-top pt-5">
                        <span class="inline-flex items-center text-xs font-medium text-slate-500 bg-white border border-slate-200 px-2 py-1 rounded">
                            <i class="ph ph-link mr-1"></i> ${fonte}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-center align-top pt-5">
                        <span class="inline-flex items-center gap-1 px-2 py-1 rounded bg-green-50 text-green-700 text-xs font-semibold border border-green-200 shadow-sm">
                            <i class="ph-fill ph-check-circle"></i> Aprovado
                        </span>
                    </td>
                    <td class="px-6 py-4 text-right align-top pt-5">
                        <a href="${link}" target="_blank" class="inline-flex items-center justify-center gap-1.5 px-3 py-1.5 bg-white border border-slate-300 rounded-md text-sm font-medium text-slate-700 hover:bg-slate-50 hover:text-brand-600 transition-colors group-hover:border-brand-300">
                            Acessar <i class="ph-bold ph-arrow-up-right text-xs"></i>
                        </a>
                    </td>
                `;
                corpoTabela.appendChild(tr);
            });
        }

        function exibirMensagemVazia(mensagem) {
            corpoTabela.innerHTML = `
                <tr>
                    <td colspan="4" class="px-6 py-12 text-center text-slate-500">
                        <div class="flex flex-col items-center justify-center">
                            <i class="ph-duotone ph-coffee text-4xl text-slate-400 mb-3"></i>
                            <p class="font-medium text-slate-700 text-lg">Nenhuma novidade encontrada.</p>
                            <p class="text-sm mt-1 max-w-md">${mensagem}</p>
                        </div>
                    </td>
                </tr>
            `;
            statusTabela.className = "px-2.5 py-1 bg-amber-100 text-amber-700 text-xs font-bold rounded-full";
            statusTabela.innerText = "Sem Resultados";
        }

        function exibirErroServidor() {
            corpoTabela.innerHTML = `
                <tr>
                    <td colspan="4" class="px-6 py-12 text-center">
                        <div class="flex flex-col items-center justify-center p-4 bg-red-50 rounded-lg border border-red-100 max-w-lg mx-auto">
                            <i class="ph-fill ph-warning-circle text-4xl text-red-500 mb-2"></i>
                            <p class="font-bold text-red-700 text-lg">Falha de Comunicação com a API</p>
                            <p class="text-sm text-red-600 mt-2 text-left w-full">
                                <strong>Verifique se:</strong>
                                <ul class="list-disc list-inside text-left mt-1">
                                    <li>O servidor Python está rodando (<code>uvicorn main:app --reload</code>).</li>
                                    <li>A porta <code>8000</code> está com visibilidade Pública no Codespaces.</li>
                                </ul>
                            </p>
                        </div>
                    </td>
                </tr>
            `;
            statusTabela.className = "px-2.5 py-1 bg-red-100 text-red-700 text-xs font-bold rounded-full";
            statusTabela.innerText = "Erro Crítico";
        }
    </script>
</body>
</html>
