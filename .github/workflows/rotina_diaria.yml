name: Radar de Editais Diário

on:
  schedule:
    # Roda todos os dias às 09:00 UTC (06:00 horário local)
    - cron: '0 9 * * *'
  workflow_dispatch: # Cria um botão no GitHub para você forçar a execução quando quiser

jobs:
  executar_varredura:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Baixar o código do repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # O GitHub vai preparar um ambiente limpo com essa versão

      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Executar o Piloto Automático
        env:
          # Injeção das chaves criptografadas armazenadas no GitHub Secrets
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          SENHA_APP: ${{ secrets.SENHA_APP }}
        run: |
          python backend/app/scripts/executar_rotina_cron.py